application:
  subdomain: arcane
  background_task: true
  multi_instance: false
  upstreams:
    - location: /
      backend: http://arcane:3552/
services:
  arcane:
    # upstream: ghcr.io/getarcaneapp/manager:v2.11.0-next.30
    image: ghcr.1ms.run/getarcaneapp/manager:v2.11.0-next.30
    environment:
      - ENCRYPTION_KEY={{ stable_secret "arcane_encryption_key" | substr 0 32 }}
      - TZ=UTC
      - APP_URL=https://{{ .S.AppDomain }}
    binds:
      - /lzcapp/var/data:/app/data
usage: |
  首次登录账号为 arcane，密码为 arcane-admin；登录后按照提示修改密码。
  本应用使用 Docker socket 管理宿主 Docker，仅应授权可信用户使用。
  首次安装需要宿主机存在 /var/run/docker.sock，并允许容器访问。
  当前版本为 next 预发布版。容器管理操作会直接影响宿主 Docker 中的容器和数据。
  加密密钥由系统稳定生成；迁移到其他微服时需同时迁移原有密钥。
